services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  file-service:
    build:
      context: .
      dockerfile: FileService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=appdb;Username=app;Password=app"
      FileStorage__RootPath: "/files"
    depends_on:
      - postgres
    volumes:
      - filesdata:/files
    networks:
      - appnet
    ports:
      - "8081:8080"

  analysis-service:
    build:
      context: .
      dockerfile: AnalysisService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=appdb;Username=app;Password=app"
      FileStorage__RootPath: "/files"
    depends_on:
      - postgres
    volumes:
      - filesdata:/files
    networks:
      - appnet
    ports:
      - "8082:8080"

  gateway:
    build:
      context: .
      dockerfile: Gateway.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Services__FileService: "http://file-service:8080/"
      Services__AnalysisService: "http://analysis-service:8080/"
    depends_on:
      - file-service
      - analysis-service
    networks:
      - appnet
    ports:
      - "8080:8080"

volumes:
  pgdata:
  filesdata:

networks:
  appnet: